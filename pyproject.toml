[project]
name = "commspt-bot"
version = "0.1.0"
description = "commspt-bot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[aiohttp,fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-alconna>=0.62.1",
    "httpx[http2,socks]>=0.26.0",
    "pydantic>=2.5.3",
    "pyyaml>=6.0",
    "motor>=3.3.2",
    "yggdrasil-mc==0.2.7",
    "pillow>=10.3.0",
    "jinja2>=3.1.3",
    "arrow>=1.3.0",
    "pytz>=2024.1",
    "email-validator>=2.1.0.post1",
    "truststore>=0.10.4",
]

[project.optional-dependencies]
# 本地 Playwright 渲染后端（BROWSERLESS_MODE=LOCAL）
# 安装：uv sync --extra render-local && uv run playwright install chromium
render-local = ["playwright>=1.40"]

[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-alconna = ["nonebot_plugin_alconna"]

[dependency-groups]
dev = [
    "nonebug>=0.4.4",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 与原项目 commspt-bot-avilla 保持一致的忽略项：
# BLE001 保留原有宽泛 except（业务上用于兜底外部 API 调用）
# PERF102 保留原项目的 dict 迭代写法
# B008 NoneBot 依赖注入惯用法：CommandArg() / RegexDict() 必须作为参数默认值出现
ignore = [
    "BLE001",
    "PERF102",
    "B008",
]
